<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10131b"><title>FEXTOH CAR RACING</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131b;color:white;font-family:Arial;touch-action:none}
#game{position:relative;width:100%;height:100%;max-width:560px;margin:auto;background:linear-gradient(#75bce9 0 34%,#477d38 34%)}#road{position:absolute;inset:0 auto 0 15%;width:70%;background:linear-gradient(90deg,#505050,#777,#505050);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}
.edge{position:absolute;top:0;height:100%;width:5px;background:#fff9}.l{left:22%}.r{right:22%}#lines{position:absolute;inset:0;animation:move .55s linear infinite;animation-play-state:paused}.lane{position:absolute;top:-100%;height:200%;width:7px;background:repeating-linear-gradient(to bottom,#fff 0 45px,transparent 45px 90px)}#lane1{left:39%}#lane2{left:61%}@keyframes move{to{transform:translateY(90px)}}
#hud{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.badge{background:#111b;padding:8px 10px;border:1px solid #ffffff55;border-radius:11px;font-weight:bold;font-size:13px}
.car{position:absolute;width:48px;height:82px;border-radius:13px;border:3px solid #222;z-index:3;box-shadow:0 5px 8px #0008}.car:before{content:"";position:absolute;left:8px;right:8px;top:13px;height:25px;border-radius:6px;background:#bdeaff}.car:after{content:"";position:absolute;left:-5px;right:-5px;bottom:10px;height:9px;background:#222;border-radius:4px}
#player{background:linear-gradient(90deg,#e65c00,#ff9b20,#d94b00);bottom:145px;left:calc(50% - 24px)}.enemy{background:linear-gradient(90deg,#1747a5,#4d8cff,#153b8c)}
#controls{position:absolute;z-index:6;bottom:15px;left:0;right:0;display:flex;align-items:end;justify-content:space-between;padding:0 14px;gap:7px}.group{display:flex;gap:7px;align-items:end}button{border:0;border-radius:14px;background:#ff8500;color:white;font-weight:800;font-size:15px;min-width:57px;min-height:55px;padding:9px;box-shadow:0 4px 0 #a94d00;touch-action:none}button:active,.pressed{transform:translateY(3px);box-shadow:0 1px 0 #a94d00}#brake{background:#c52c35;box-shadow:0 4px 0 #761820}#gas{background:#188d4a;box-shadow:0 4px 0 #0d542b}
#steering{width:112px;height:112px;min-width:112px;min-height:112px;border-radius:50%;padding:0;background:radial-gradient(circle at center,#303844 0 17%,#111923 18% 25%,#d6dce4 26% 31%,#202833 32% 100%);border:7px solid #aeb7c3;box-shadow:0 4px 0 #56606d;position:relative;touch-action:none;user-select:none}#steering:before{content:"";position:absolute;left:12px;right:12px;top:43px;height:12px;background:#dce3eb;border-radius:8px}#steering:after{content:"";position:absolute;left:48px;top:14px;width:10px;height:38px;background:#dce3eb;border-radius:6px}#steering span{position:absolute;left:47px;bottom:13px;width:12px;height:35px;background:#dce3eb;border-radius:6px;transform:rotate(0deg)}.pedals{display:flex;gap:7px}
#overlay{position:absolute;z-index:10;inset:0;background:#080b12dc;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px}.panel{max-width:340px;background:#171d29;border:1px solid #ffffff33;border-radius:22px;padding:24px}h1{margin:0 0 8px;color:#ff941f;font-size:29px}p{line-height:1.45;color:#d7deea}.small{font-size:12px;color:#aeb9c9}#start{margin-top:8px;min-height:48px}
</style></head><body><div id="game"><div id="road"><div class="edge l"></div><div class="edge r"></div><div id="lines"><div class="lane" id="lane1"></div><div class="lane" id="lane2"></div></div></div>
<div id="hud"><div class="badge">SCORE: <span id="score">0</span></div><div class="badge">SPEED: <span id="speed">0</span></div></div><div id="player" class="car"></div>
<div id="controls"><div class="group"><div id="steering" aria-label="Steering wheel"><span></span></div></div><div class="group pedals"><button id="brake">BRAKE</button><button id="gas">GAS</button></div></div>
<div id="overlay"><div class="panel"><h1>FEXTOH<br>CAR RACING</h1><p>Steer around traffic. Hold GAS to speed up and BRAKE to slow down.</p><p class="small">Drag the steering wheel left or right. Hold GAS to accelerate and BRAKE to slow down.</p><button id="start">START RACE</button></div></div></div>
<script>
const game=document.getElementById('game'),player=document.getElementById('player'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),speedEl=document.getElementById('speed'),lines=document.getElementById('lines');
let running=false,score=0,speed=3,x=0,enemies=[],spawnTimer=0,last=0,steer=0,wheelPointer=null,wheelStartX=0;const keys={left:false,right:false,gas:false,brake:false};
function bounds(){return{min:game.clientWidth*.15+45,max:game.clientWidth*.85-45}}function draw(){player.style.left=x+'px'}
function start(){enemies.forEach(e=>e.el.remove());enemies=[];score=0;speed=3;spawnTimer=0;let b=bounds();x=Math.max(b.min,Math.min(b.max,game.clientWidth/2-24));draw();scoreEl.textContent=0;speedEl.textContent=1;overlay.style.display='none';running=true;lines.style.animationPlayState='running';last=performance.now();requestAnimationFrame(loop)}
function spawn(){let xs=[game.clientWidth*.36-24,game.clientWidth*.5-24,game.clientWidth*.64-24],b=bounds(),xx=Math.max(b.min,Math.min(b.max,xs[Math.random()*3|0])),el=document.createElement('div');el.className='car enemy';el.style.left=xx+'px';el.style.top='-95px';game.appendChild(el);enemies.push({el,y:-95})}
function finish(){running=false;lines.style.animationPlayState='paused';overlay.style.display='flex';overlay.querySelector('h1').textContent='RACE OVER';overlay.querySelector('p').textContent='Your score: '+score+'. Try again!';document.getElementById('start').textContent='RACE AGAIN'}
function loop(t){if(!running)return;let dt=Math.min((t-last)/16.67,2);last=t;let b=bounds();x+=steer*7.2*dt;x=Math.max(b.min,Math.min(b.max,x));draw();if(keys.gas)speed=Math.min(10,speed+.09*dt);else if(keys.brake)speed=Math.max(1.5,speed-.18*dt);else speed=Math.max(3,speed-.025*dt);speedEl.textContent=Math.round(speed*10);spawnTimer+=dt*16.67;if(spawnTimer>Math.max(420,1100-score*2)){spawn();spawnTimer=0}let pr=player.getBoundingClientRect();for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.y+=speed*dt;e.el.style.top=e.y+'px';let r=e.el.getBoundingClientRect();if(pr.left<r.right-7&&pr.right>r.left+7&&pr.top<r.bottom-8&&pr.bottom>r.top+8){finish();return}if(e.y>game.clientHeight){e.el.remove();enemies.splice(i,1);score+=10;scoreEl.textContent=score}}requestAnimationFrame(loop)}
function bind(id,k){let el=document.getElementById(id),on=e=>{e.preventDefault();keys[k]=true;el.classList.add('pressed')},off=()=>{keys[k]=false;el.classList.remove('pressed')};el.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(v=>el.addEventListener(v,off))}
bind('gas','gas');bind('brake','brake');
const wheel=document.getElementById('steering');function wheelDown(e){e.preventDefault();wheelPointer=e.pointerId;wheelStartX=e.clientX;wheel.setPointerCapture(e.pointerId)}function wheelMove(e){if(wheelPointer!==e.pointerId)return;e.preventDefault();let delta=e.clientX-wheelStartX;steer=Math.max(-1,Math.min(1,delta/48));wheel.style.transform='rotate('+Math.max(-135,Math.min(135,delta*2.2))+'deg)'}function wheelUp(e){if(wheelPointer!==e.pointerId)return;wheelPointer=null;steer=0;wheel.style.transform='rotate(0deg)'}wheel.addEventListener('pointerdown',wheelDown);wheel.addEventListener('pointermove',wheelMove);['pointerup','pointercancel','lostpointercapture'].forEach(v=>wheel.addEventListener(v,wheelUp));document.getElementById('start').addEventListener('click',start);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')steer=-1;if(e.key==='ArrowRight')steer=1;if(e.key==='ArrowUp')keys.gas=true;if(e.key==='ArrowDown'||e.key===' ')keys.brake=true});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')steer=0;if(e.key==='ArrowUp')keys.gas=false;if(e.key==='ArrowDown'||e.key===' ')keys.brake=false});
</script></body></html>
